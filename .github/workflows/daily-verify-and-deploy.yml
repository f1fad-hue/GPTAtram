name: Daily research verification and Pages deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages-status:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        name: Check whether GitHub Pages is enabled
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              core.warning('GitHub Pages is not enabled. Enable it once in repository Settings → Pages, select GitHub Actions, then the next scheduled run will deploy automatically.');
              core.setOutput('enabled', 'false');
            }
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm run validate
      - name: Static source and build sanity check
        run: |
          test -f index.html && test -f app.js && test -f styles.css
          grep -q 'Monte Carlo' index.html
  deploy:
    needs: [pages-status, verify]
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: '.'}
      - id: deployment
        uses: actions/deploy-pages@v4
