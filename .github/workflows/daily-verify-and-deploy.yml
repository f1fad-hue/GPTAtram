name: Daily research verification and Pages deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate data constraints and drawdown guardrails
        run: npm run validate
      - name: Audit authoritative sources and factual-claim coverage
        run: AUDIT_REPORT_PATH=reports/daily-authoritative-audit.md npm run audit
      - name: Run code, math and static-site sanity checks
        run: |
          node --check app.js
          node --check scripts/validate-data.mjs
          node --check scripts/authoritative-audit.mjs
          node --check scripts/write-monitoring-snapshot.mjs
          git diff --check
          test -f index.html && test -f app.js && test -f styles.css
          grep -q 'Monte Carlo' index.html
          grep -q 'Fed policy, US real yields and liquidity' data/portfolio.json
          grep -q 'ATRAM Peso Money Market Fund - D PHP' data/portfolio.json
          grep -q 'ATRAM Global Technology Feeder Fund - D PHP' data/portfolio.json
          grep -q 'ATRAM Nasdaq Equity Income Feeder Fund - D PHP' data/portfolio.json
      - name: Publish the daily audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-authoritative-audit
          path: reports/daily-authoritative-audit.md
          if-no-files-found: warn
          retention-days: 90
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write live monitoring snapshot
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/write-monitoring-snapshot.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: '.'}
      - id: deployment
        uses: actions/deploy-pages@v4
  monitoring-alert:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Open, update, or resolve the daily monitoring alert
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const title = 'Daily portfolio monitoring failure';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (process.env.VERIFY_RESULT !== 'success') {
              const body = `Automated source, data, math, or code verification failed. The live site was not updated.\n\nRun: ${runUrl}\nCommit: ${context.sha}`;
              if (existing) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Monitoring recovered successfully.\n\nRun: ${runUrl}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }
