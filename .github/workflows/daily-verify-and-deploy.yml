name: Daily research verification and Pages deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages for Actions deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow'
              });
              core.info('GitHub Pages enabled for workflow deployment.');
            } catch (error) {
              if (error.status === 409 || error.status === 422) {
                core.info(`GitHub Pages is already configured: ${error.message}`);
              } else {
                core.setFailed(`Could not configure GitHub Pages: ${error.message}`);
              }
            }
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm run validate
      - name: Static source and build sanity check
        run: |
          test -f index.html && test -f app.js && test -f styles.css
          grep -q 'Monte Carlo' index.html
  deploy:
    needs: [enable-pages, verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: '.'}
      - id: deployment
        uses: actions/deploy-pages@v4
